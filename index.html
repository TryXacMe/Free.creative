<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Free.creative</title>
  </head>
  <body>
    <header class="header">
      <div class="header__container container">
        <div class="header__logos">
          <img src="./assents/logo.svg" alt="logo" class="header__logo" />
          <p class="header__text">Разрабатываем фирменные стили с 2009 года</p>
        </div>

        <nav class="header__navbar">
          <button class="header__Nbtn">8 (495) 156-39-11</button>
          <button class="header__Fbtn">
            <img
              src="./assents/facebook.png"
              alt="facebook"
              class="header__facebook"
            />
          </button>
          <button class="header__Ibtn">
            <img
              src="./assents/instagramm.png"
              alt="instagramm"
              class="header__instagramm"
            />
          </button>
        </nav>
      </div>
    </header>

    <main>
      <section class="intro">
        <div class="intro__container container">
          <h1 class="intro__title">
            Вам нужен фирменный стиль или ребрендинг?
          </h1>
          <p class="intro__text">Разработаем в срок от 10-ти дней</p>
          <div class="intro__buttons">
            <button class="intro__btn">Портфолио</button>
            <button class="intro__btn">Оставить заявку</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
